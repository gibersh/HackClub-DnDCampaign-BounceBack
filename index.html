<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Campaign</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background: #000;
            color: #eee;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            cursor: text;
        }
        #output { white-space: pre-wrap; line-height: 1.4; }
        #input-line { display: none; margin-top: 4px; }
        input {
            background: transparent;
            color: #0f0;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            width: 50%;
        }
    </style>
</head>
<body onclick="document.getElementById('user-input').focus()">

<div id="output">Loading Python...</div>
<div id="input-line">
    <span id="prompt"></span><input id="user-input" type="text" autocomplete="off">
</div>

<script>
    const out = document.getElementById("output");
    const inputLine = document.getElementById("input-line");
    const promptSpan = document.getElementById("prompt");
    const userInput = document.getElementById("user-input");

    function write(text) {
        const html = text
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\x1b\[31m/g, '<span style="color:#ff5555">')
            .replace(/\x1b\[34m/g, '<span style="color:#5555ff">')
            .replace(/\x1b\[0m/g, '</span>');
        out.innerHTML += html;
        window.scrollTo(0, document.body.scrollHeight);
    }

    window.browserInput = (promptText = "") => {
        return new Promise((resolve) => {
            promptSpan.textContent = promptText;
            inputLine.style.display = "block";
            userInput.value = "";
            userInput.focus();

            userInput.onkeydown = (e) => {
                if (e.key === "Enter") {
                    const val = userInput.value;
                    inputLine.style.display = "none";
                    write(promptText + val + "\n");
                    resolve(val);
                }
            };
        });
    };

    async function run() {
        try {
            const response = await fetch("./Campaign.py");
            if (!response.ok) throw new Error(`Could not find ./Campaign.py (HTTP ${response.status})`);
            let code = await response.text();

            const pyodide = await loadPyodide();
            out.innerHTML = "";

            pyodide.setStdout({ batched: (msg) => write(msg + "\n") });
            pyodide.globals.set("input", window.browserInput);

            code = code.replace(/\binput\s*\(/g, "await input(");
            await pyodide.runPythonAsync(code);
        } catch (err) {
            out.innerHTML = `<span style="color:#ff5555">Error: ${err.message}\n\nMake sure you are running a local server (python -m http.server 8000) and opening http://localhost:8000 instead of double-clicking index.html.</span>`;
        }
    }

    run();
</script>
</body>
</html>
