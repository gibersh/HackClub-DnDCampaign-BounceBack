<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://jsdelivr.net"></script>
    
    <link rel="stylesheet" href="https://pyscript.net" />

    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background-color: #000;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div id="terminal-container"></div>

<!-- SharedArrayBuffer bridge for synchronous Python input() in a Worker -->
<script>
    const term = new Terminal({
        cursorBlink: true,
        fontFamily: '"Courier New", Courier, monospace',
        fontSize: 15,
        theme: { background: '#000000', foreground: '#f0f0f0' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();
    window.addEventListener('resize', () => fitAddon.fit());

    // Expose terminal write and blocking input to the PyScript Worker
    window.termWrite = (text) => {
        term.write(text.replace(/\n/g, '\r\n'));
    };

    window.termReadLine = (promptText) => {
        return new Promise((resolve) => {
            if (promptText) window.termWrite(promptText);
            let line = '';
            const disposable = term.onData(data => {
                const code = data.charCodeAt(0);
                if (code === 13) {
                    term.write('\r\n');
                    disposable.dispose();
                    resolve(line);
                } else if (code === 127) {
                    if (line.length > 0) {
                        line = line.slice(0, -1);
                        term.write('\b \b');
                    }
                } else if (code >= 32) {
                    line += data;
                    term.write(data);
                }
            });
        });
    };
</script>

<!-- PyScript config to hook up I/O before Campaign.py executes -->
<script type="py" worker>
import builtins
from pyscript import window, sync

def custom_print(*args, sep=' ', end='\n', **kwargs):
    text = sep.join(str(a) for a in args) + end
    window.termWrite(text)

def custom_input(prompt=""):
    # Uses PyScript's worker sync bridge to pause synchronously until Enter is pressed
    return sync.termReadLine(str(prompt))

builtins.print = custom_print
builtins.input = custom_input
</script>

<!-- Load and run your external Campaign.py file in the same worker -->
<script type="py" src="./Campaign.py" worker></script>

</body>
</html>
